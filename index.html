<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Feature Mind Maps</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="/src/assets/apple-touch-icon.png" />
    <script>
      // Apply a saved theme before first paint (key must match src/components/ThemeToggle.jsx).
      try {
        var theme = localStorage.getItem('feature-mind-maps.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/home/main.jsx"></script>
  </body>
</html>
